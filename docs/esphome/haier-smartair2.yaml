# ESPHome firmware for a Haier air conditioner with a SmartAir2-era USB Wi-Fi port,
# driven by an ESP32-C3 SuperMini plugged straight into that port with a USB-A to USB-C
# cable. See docs/esphome.md for the hardware, flashing and how aircon finds the board.
#
# Copy this file next to a secrets.yaml with wifi_ssid, wifi_password, ap_password and
# ota_password, change the two names below, then: esphome run haier-smartair2.yaml

substitutions:
  name: ac-bedroom            # hostname: lowercase letters, digits and dashes
  friendly_name: AC bedroom

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1

# The USB data pins talk to the air conditioner, so nothing may log to them.
# Logs are still on the board's web page. To flash over USB again, hold BOOT while
# plugging the board into the computer; normally you update it over Wi-Fi.
logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The SuperMini's antenna is weak at full power; 8.5 dB keeps it connected.
  output_power: 8.5dB
  # If the Wi-Fi above fails, the board opens this hotspot to fix it from a phone.
  ap:
    ssid: ${name}-setup
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# aircon talks to the board through this web server (and so can a browser).
web_server:
  port: 80
  version: 3

# The AC's USB-A port is a 5 V serial port, not USB. Through the cable, its data lines
# land on the ESP32-C3's USB pins: GPIO18 (D-) and GPIO19 (D+), used here as a UART.
# If the board never gets an answer, swap tx_pin and rx_pin.
uart:
  id: ac_port
  baud_rate: 9600
  tx_pin: GPIO18
  rx_pin: GPIO19

climate:
  - platform: haier
    id: haier_ac
    name: Air conditioner
    protocol: smartair2
    uart_id: ac_port

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
